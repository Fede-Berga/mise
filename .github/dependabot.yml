version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/services/common"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "fbergamini"
    labels:
      - "dependencies"
      - "python"
    groups:
      python-deps:
        patterns: ["*"]

  - package-ecosystem: "npm"
    directory: "/mise-web"
    schedule:
      interval: "weekly"
      day: "monday"
    reviewers:
      - "fbergamini"
    labels:
      - "dependencies"
      - "javascript"
    groups:
      npm-deps:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
