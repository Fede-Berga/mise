name: 🐛 Bug Report
description: Report a bug in Mise
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please fill in the details below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Start the core stack: `docker compose -f docker-compose.core.yml up -d`
        2. Send request: `curl ...`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      options:
        - restaurant-service
        - menu-service
        - order-service
        - kitchen-service
        - inventory-service
        - personnel-service
        - finance-service
        - notification-service
        - analytics-service
        - ai-service
        - hardware-service
        - mise-web
        - Docker Compose / Infrastructure
        - Other

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker version, deployment method, etc.
      placeholder: |
        - OS: Ubuntu 24.04
        - Docker: 27.x
        - Deployment: docker-compose.core.yml
