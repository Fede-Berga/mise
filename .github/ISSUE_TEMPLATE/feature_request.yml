name: ✨ Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: We'd love to hear your ideas! Please describe the feature you'd like.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Is it related to a frustration?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see implemented.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered?

  - type: dropdown
    id: component
    attributes:
      label: Related Component
      options:
        - restaurant-service
        - menu-service
        - order-service
        - kitchen-service
        - inventory-service
        - personnel-service
        - finance-service
        - notification-service
        - analytics-service
        - ai-service
        - hardware-service
        - mise-web
        - New Service
        - Infrastructure
        - Other
