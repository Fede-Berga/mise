site_name: Mise Platform
site_description: Multi-tenant restaurant platform for order, kitchen, and operations workflows.
site_url: https://example.invalid/mise
repo_name: federicobergamini/mise
repo_url: https://github.com/federicobergamini/mise

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart (Docker Core): getting-started/quickstart.md
      - Test Users & Roles: getting-started/roles.md
  - Quality Assurance:
      - Test Strategy: qa/test-strategy.md
      - Manual E2E Checklist: qa/e2e-checklist.md
  - Architecture:
      - Overview: architecture/overview.md
  - Deployment:
      - Docker Compose: deployment/docker-compose.md
      - kind on Rocky Linux: deployment/kind-rocky.md
  - Engineering:
      - Git Workflow: engineering/git-workflow.md
      - Extensibility: contributing/extensibility.md

plugins:
  - search

markdown_extensions:
  - admonition
  - toc:
      permalink: true
