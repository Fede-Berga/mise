[project]
name = "mise-analytics-service"
version = "0.1.0"
requires-python = ">=3.13"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E","W","F","I","N","UP","B","A","C4","DTZ","T20","SIM","TCH","RUF","S","PT"]
ignore = [
    "S101",
    "B008",
    "TC001",
    "TC002",
    "TC003",
    "UP035",
    "UP043",
    "UP047",
    "A005",
    "I001",
    "F401",
    "RUF100",
    "DTZ011",
    "B904",
    "UP045",
    "E501",
    "UP042",
    "DTZ003",
    "RUF019",
    "UP017",
    "UP037",
    "F821",
    "SIM108",
    "SIM105",
    "PT017",
    "RUF001",
    "RUF002",
    "UP006",
]
