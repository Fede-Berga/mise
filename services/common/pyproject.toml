[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mise-common"
version = "0.1.0"
description = "Shared library for Mise microservices"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.3,<1.0",
    "uvicorn[standard]>=0.44.0,<1.0",
    "sqlalchemy>=2.0.49,<3.0",
    "psycopg[binary]>=3.3.3,<4.0",
    "pydantic>=2.13.0,<3.0",
    "pydantic-settings>=2.13.1,<3.0",
    "python-dotenv>=1.2.2,<2.0",
    "nats-py>=2.14.0,<3.0",
    "redis>=7.4.0,<8.0",
    "httpx>=0.28.1,<1.0",
    "structlog>=25.5.0,<26.0",
    "orjson>=3.11.8,<4.0",
    "opentelemetry-sdk>=1.41.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.62b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.62b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.41.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.15.10",
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
    "pre-commit>=4.5.1",
    "alembic>=1.18.4",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "DTZ",
    "T20",
    "SIM",
    "TCH",
    "RUF",
    "S",
    "PT",
]
ignore = [
    "S101",
    "B008",
    "TC001",
    "TC002",
    "TC003",
    "UP035",
    "UP043",
    "UP047",
    "A005",
    "I001",
    "F401",
    "RUF100",
    "DTZ011",
    "B904",
    "UP045",
    "E501",
    "UP042",
    "DTZ003",
    "RUF019",
    "UP017",
    "UP037",
    "F821",
    "SIM108",
    "SIM105",
    "PT017",
    "RUF001",
    "RUF002",
    "UP006",
]


[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "T20"]
"**/conftest.py" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["nats.*", "redis.*", "opentelemetry.*", "structlog.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--tb=short", "-q"]
markers = [
    "integration: marks tests as integration tests (require running infra)",
    "slow: marks tests as slow",
]
