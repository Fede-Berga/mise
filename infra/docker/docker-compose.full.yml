          memory: 256M
        reservations:
          memory: 128M

  mise-web:
    image: ghcr.io/mise-restaurant/mise-web:dev
    build:
      context: ../..
      dockerfile: mise-web/Dockerfile
    environment:
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-mise-dev-secret}
      NEXTAUTH_DEBUG: ${NEXTAUTH_DEBUG:-false}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://traefik}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/auth/realms/mise-master}
      RESTAURANT_SVC_URL: http://restaurant-svc:8000
      MENU_SVC_URL: http://menu-svc:8000
      ORDER_SVC_URL: http://order-svc:8000
      KITCHEN_SVC_URL: http://kitchen-svc:8000
    depends_on:
      traefik:
        condition: service_healthy
      restaurant-svc:
        condition: service_healthy
      menu-svc:
        condition: service_healthy
      order-svc:
        condition: service_healthy
      kitchen-svc:
        condition: service_healthy
      inventory-svc:
        condition: service_healthy
      personnel-svc:
        condition: service_healthy
      finance-svc:
        condition: service_healthy
      notification-svc:
        condition: service_healthy
      analytics-svc:
        condition: service_healthy
      ai-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      traefik.enable: "true"
      traefik.http.routers.mise-web.rule: "Host(`app.local.mise`)"
      traefik.http.routers.mise-web.entrypoints: "web"
      traefik.http.services.mise-web.loadbalancer.server.port: "3000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

volumes:
  pg_data:
  dragonfly_data:
  nats_data:
  minio_data:
  clickhouse_data:
  meili_data:

networks:
  default:
    name: mise-full
