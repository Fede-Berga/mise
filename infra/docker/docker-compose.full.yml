      context: .
      dockerfile: services/analytics-service/Dockerfile
    environment:
      SERVICE_NAME: analytics-service
      CLICKHOUSE_URL: http://clickhouse:8123
      NATS_URL: ${NATS_URL:-nats://nats:4222}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
